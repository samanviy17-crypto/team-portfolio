---
layout: poway-clone-auth
title: Reset Password
auth_nav: login
page_script_path: /assets/js/pages/reset-password-page.js
---
<div class="auth-shell-card">
  <h1>Reset your password</h1>
  <div id="reset-error" class="auth-error-box" role="alert"></div>
  <p id="reset-success" role="status"></p>
  <form id="reset-form">
    <label for="reset-password">New password</label>
    <input id="reset-password" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required>
    <label for="reset-confirm">Confirm password</label>
    <input id="reset-confirm" type="password" autocomplete="new-password" required>
    <button class="auth-button" type="submit">Update Password</button>
  </form>
  <a href="{{ '/pages/register.html#login' | relative_url }}">Sign in</a>
</div>
