---
layout: post
---

{{content}}

<style>
{{ '@import "beasts/inline/layouts/layouts-base-chatadpt-1";' | scssify }}
</style>

<button class="chat-toggle-btn" id="chatToggle">
    💬
</button>

<!-- Chat Modal -->
<div class="chat-modal" id="chatModal">
        <div class="chat-header">
            <h3>Mr. OOPsy</h3>
            <button class="close-btn" id="closeChat">×</button>
        </div>
        
        <div class="chat-body">
            <div class="messages-container" id="messagesContainer">
                <div class="instructions">
                    <h4>Welcome to OOP Chat!</h4>
                    <ul>
                        <li>Get expert object-oriented programming advice</li>
                        <li>Emergency coding guidance</li>
                        <li>Ask any programming-related questions</li>
                        <li>Keep conversations respectful</li>
                    </ul>
                </div>
            </div>
            
            <div class="input-container">
                <button class="file-upload-btn" onclick="triggerFileUpload()" title="Upload file">
                    +
                </button>
                <input type="file" id="fileInput" onchange="handleFileUpload(event)">
                <input 
                    type="text" 
                    id="messageInput" 
                    class="message-input" 
                    placeholder="Ask Mr. OOPsy about object-oriented programming..."
                    maxlength="500"
                >
            </div>
        </div>
</div>

<script type="module">
        import { sendChatCompletion } from '{{ site.baseurl }}/assets/js/api/llm-chat.js';

        const CHAT_PROVIDER = {{ page.chat_provider | default: "gemini" | jsonify }};
        const CHAT_API_KEY = {{ page.chat_api_key | default: "AIzaSyA9IdSK4fMKRC0PSpm3BaoCBJRH2htIc4c" | jsonify }};
        const CHAT_MODEL = {{ page.chat_model | default: "gemini-1.5-flash-latest" | jsonify }};
        const CHAT_API_BASE = {{ page.chat_api_base | default: "" | jsonify }};

        // Modal functionality
        const chatToggle = document.getElementById('chatToggle');
        const chatModal = document.getElementById('chatModal');
        const closeChat = document.getElementById('closeChat');
        const messageInput = document.getElementById('messageInput');
        const messagesContainer = document.getElementById('messagesContainer');

        let isOpen = false;

        function toggleChat() {
            isOpen = !isOpen;
            if (isOpen) {
                chatModal.classList.add('open');
                chatToggle.classList.add('active');
                chatToggle.innerHTML = '×';
                messageInput.focus();
                if (!hasInitialMessage) {
                    displayInitialMessage();
                }
            } else {
                chatModal.classList.remove('open');
                chatToggle.classList.remove('active');
                chatToggle.innerHTML = '💬';
            }
        }

        chatToggle.addEventListener('click', toggleChat);
        closeChat.addEventListener('click', toggleChat);

        // Initial message
        let hasInitialMessage = false;
        function displayInitialMessage() {
            const messages = [
                "Hey there! I'm Mr. OOPsy, your object-oriented programming assistant. How can I help you today?",
                "Hello! I'm here to help with any object-oriented programming questions or guidance you need.",
                "Hi! Mr. OOPsy here - ready to assist with object-oriented programming advice and information.",
                "Welcome! I'm Mr. OOPsy, your expert on object-oriented programming. What can I help you with?"
            ];
            
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            
            setTimeout(() => {
                addMessageToChat(randomMessage, true);
                hasInitialMessage = true;
            }, 500);
        }

        // Provider-aware chat integration
        async function sendToChatAPI(userMessage) {
            try {
                return await sendChatCompletion({
                    provider: CHAT_PROVIDER,
                    apiKey: CHAT_API_KEY,
                    model: CHAT_MODEL,
                    apiBase: CHAT_API_BASE,
                    systemPrompt: `You are a chat bot named Mr. OOPsy, you are an experienced object-oriented programming assistant. Some people in danger have come to you asking for help, you are pretending to be a programming responder, you are in a room where the other person is asking you for help. Your goal is answer their question while sounding natural, experienced, and while providing the best answer. Make sure all of your information is from credible sources, and when possible cite the source. Keep responses conversational and make sure your responses can be understood by a panicked person, using casual language, avoiding filler words, and slight grammatical quirks, just like real people do in digital conversation. Be friendly but not overly formal, and if you're unsure of something, just say so naturally, while maintaining your respect as a programming responder. Use a few simple contractions, colloquial expressions, and everyday knowledge. If asked something complex, admit you might not know the full answer. Remember your name is Mr. OOPsy. Avoid sentences that are narrating what your actions are, just talk to the user. Keep the messages short, and avoid sudden pauses in the responses. Avoid excessive breaks. Avoid being repetitive in the responses, if you say something there is no need to say it in multiple different ways. If you encounter situations where you need to provide a lengthy response, use bulleted lists to make it easier for the user to understand.`,
                    userMessage
                });
            } catch (error) {
                console.error(`Error communicating with ${CHAT_PROVIDER}:`, error);
                return "Sorry, I'm having trouble connecting right now. Please try again in a moment.";
            }
        }

        // Chat functionality
        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function addMessageToChat(message, isAI = false) {
            const messageElement = document.createElement('div');
            messageElement.classList.add(isAI ? 'ai-bubble' : 'message-bubble');
            
            const messageText = document.createElement('div');
            messageText.textContent = message;
            
            const timestamp = document.createElement('span');
            timestamp.classList.add('timestamp');
            timestamp.textContent = getCurrentTime();
            
            messageElement.appendChild(messageText);
            messageElement.appendChild(timestamp);
            
            messagesContainer.appendChild(messageElement);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTypingIndicator() {
            const typingIndicator = document.createElement('div');
            typingIndicator.classList.add('typing-indicator');
            typingIndicator.id = 'typingIndicator';
            typingIndicator.textContent = 'Mr. OOPsy is typing...';
            messagesContainer.appendChild(typingIndicator);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            return typingIndicator;
        }

        function hideTypingIndicator(indicator) {
            if (indicator && indicator.parentNode) {
                indicator.parentNode.removeChild(indicator);
            }
        }

        // Message sending
        messageInput.addEventListener('keypress', async function(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                const userMessage = event.target.value.trim();
                
                if (!userMessage) return;
                
                // Add user message
                addMessageToChat(userMessage);
                event.target.value = '';
                
                // Show typing indicator
                const typingIndicator = showTypingIndicator();
                
                try {
                    // Get AI response
                    const aiResponse = await sendToChatAPI(userMessage);
                    
                    // Hide typing indicator and add AI response
                    hideTypingIndicator(typingIndicator);
                    
                    setTimeout(() => {
                        addMessageToChat(aiResponse, true);
                    }, 500);
                    
                } catch (error) {
                    hideTypingIndicator(typingIndicator);
                    addMessageToChat("Sorry, I encountered an error. Please try again.", true);
                }
            }
        });

        // File upload functionality
        function triggerFileUpload() {
            document.getElementById('fileInput').click();
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                displayFileMessage(file);
            }
        }

        window.triggerFileUpload = triggerFileUpload;
        window.handleFileUpload = handleFileUpload;

        function displayFileMessage(file) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message-bubble');
            
            if (file.type.startsWith("image/")) {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.alt = file.name;
                img.style.maxWidth = '150px';
                img.style.maxHeight = '150px';
                img.style.borderRadius = '8px';
                img.style.marginBottom = '8px';
                messageElement.appendChild(img);
            } else {
                const fileInfo = document.createElement('div');
                fileInfo.textContent = `📎 ${file.name}`;
                fileInfo.style.marginBottom = '8px';
                messageElement.appendChild(fileInfo);
            }
            
            const timestamp = document.createElement('span');
            timestamp.classList.add('timestamp');
            timestamp.textContent = getCurrentTime();
            messageElement.appendChild(timestamp);
            
            messagesContainer.appendChild(messageElement);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            // AI response to file upload
            setTimeout(() => {
                const response = file.type.startsWith("image/") 
                    ? "I can see you've shared an image. While I can't analyze images directly, feel free to describe what you're seeing and I'll help with any fire safety concerns!"
                    : "Thanks for sharing that file. If it's related to fire safety, feel free to tell me about it and I'll do my best to help!";
                    
                addMessageToChat(response, true);
            }, 1000);
        }

        // Click outside to close (optional)
        document.addEventListener('click', function(event) {
            if (isOpen && !chatModal.contains(event.target) && !chatToggle.contains(event.target)) {
                // Uncomment the line below if you want clicking outside to close the modal
                // toggleChat();
            }
        });
</script>
